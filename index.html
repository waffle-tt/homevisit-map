<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班级家访足迹地图（片区分组版）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif; background:#F4F3EE; }
  .header { padding:12px 16px; background:#fff; border-bottom:1px solid #E4E3DD; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  .header h1 { font-size:16px; color:#1A1B1C; }
  .stats { display:flex; gap:8px; flex-wrap:wrap; }
  .stat { padding:5px 12px; border-radius:9px; font-size:12px; }
  .stat.total { background:rgba(26,27,28,0.06); color:#1A1B1C; }
  .groups { padding:10px 16px; background:#fff; border-bottom:1px solid #E4E3DD; display:flex; gap:10px; flex-wrap:wrap; }
  .group-card { border:1px solid #E4E3DD; border-radius:10px; padding:8px 12px; cursor:pointer; min-width:140px; flex:1 1 150px; max-width:260px; transition:box-shadow .15s; }
  .group-card:hover { box-shadow:0 2px 8px rgba(0,0,0,0.12); }
  .group-card .gname { font-size:13px; font-weight:600; color:#1A1B1C; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .group-card .gname .cls-tag { white-space:nowrap; }
  .group-card .gnames { font-size:12px; color:#4B5563; margin-top:4px; line-height:1.6; }
  .legend { padding:7px 16px; background:#fff; border-bottom:1px solid #E4E3DD; font-size:12px; color:#4B5563; display:flex; gap:16px; flex-wrap:wrap; }
  #map { width:100%; height:calc(100vh - 190px); min-height:420px; }
  .popup-name { font-weight:600; font-size:14px; margin-bottom:4px; }
  .popup-row { font-size:12px; color:#4B5563; line-height:1.7; }
  .popup-row b { color:#1A1B1C; }
  .badge { display:inline-block; padding:1px 8px; border-radius:8px; font-size:11px; margin-top:4px; }
  .badge.done { background:#FBE3E3; color:#C0392B; }
  .badge.todo { background:#FFF0D4; color:#B45309; }
  .foot { font-size:11px; color:#9CA3AF; text-align:center; padding:5px; background:#fff; }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>班级家访足迹地图 · 片区分组</h1>
  </div>
  <div class="stats">
    <div class="stat total" id="statTotal">共 0 户</div>
    <div class="stat total" id="statGroups">0 个片区</div>
  </div>
</div>
<div class="groups" id="groupCards"></div>
<div class="legend">
  <span>🔴 已家访</span>
  <span>🟠 未家访</span>
  <span>同卡片 = 同片区（建议同一天走访）</span>
  <span>点击卡片 → 地图定位</span>
</div>
<div id="map"></div>
<div class="foot">数据由家访智能体自动生成 · 点击圆点查看学生</div>
<script>
  var STUDENTS = [];
  STUDENTS = STUDENTS.filter(function (s) { return s.lng && s.lat; });
  var CLS_COLORS = ['#EA6668', '#4A9FD8', '#2E8B57', '#8E5AC8', '#B08968', '#E1B98F'];
  function clsColor(cls) {
    var h = 0;
    for (var i = 0; i < cls.length; i++) h = (h * 31 + cls.charCodeAt(i)) % 997;
    return CLS_COLORS[h % CLS_COLORS.length];
  }
  function distKm(lng1, lat1, lng2, lat2) {
    var dx = (lng1 - lng2) * 111 * Math.cos((lat1 + lat2) / 2 * Math.PI / 180);
    var dy = (lat1 - lat2) * 111;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function clusterStudents(list) {
    var groups = [];
    var groupMap = {};
    list.forEach(function (s) {
      var key = (s.cls || '未分班') + '|' + (s.group || '未分组');
      if (!groupMap[key]) {
        groupMap[key] = [];
        groups.push({ name: s.group || '未分组', cls: s.cls || '未分班', students: groupMap[key] });
      }
      groupMap[key].push(s);
    });
    groups.forEach(function (g) {
      var clng = 0, clat = 0;
      g.students.forEach(function (s) { clng += s.lng; clat += s.lat; });
      clng /= g.students.length; clat /= g.students.length;
      g.students.sort(function (a, b) {
        return distKm(a.lng, a.lat, clng, clat) - distKm(b.lng, b.lat, clng, clat);
      });
    });
    return groups;
  }
  var MAP_KEY = "210d3c6c3af59325ca173b83dcdafb41";
  document.write('<script src="https://webapi.amap.com/maps?v=1.4.15&key=' + MAP_KEY + '&plugin=AMap.Scale,AMap.ToolBar"><\/script>');
  window._AMapLoaded = function () {
    var map = new AMap.Map('map', { zoom: 10, center: [120.21, 31.65] });
    map.addControl(new AMap.Scale());
    map.addControl(new AMap.ToolBar({ position: 'RB' }));
    var groups = clusterStudents(STUDENTS);
    var allMarkers = [];
    document.getElementById('statTotal').textContent = '共 ' + STUDENTS.length + ' 户';
    document.getElementById('statGroups').textContent = groups.length + ' 个片区';
    var cardBox = document.getElementById('groupCards');
    groups.forEach(function (g, gi) {
      var doneN = 0, todoN = 0;
      g.students.forEach(function (s) { if (s.visited) doneN++; else todoN++; });
      var ccolor = clsColor(g.cls);
      var card = document.createElement('div');
      card.className = 'group-card';
      card.style.borderLeft = '4px solid ' + ccolor;
      card.innerHTML = '<div class="gname">📍 ' + g.name + ' <span class="cls-tag" style="font-weight:600;color:' + ccolor + ';font-size:12px;">' + g.cls + '</span></div>' +
                       '<div class="gnames"><span style="color:#C0392B;font-weight:600;">已家访 ' + doneN + ' 人</span>' +
                       ' &nbsp; <span style="color:#B45309;font-weight:600;">未家访 ' + todoN + ' 人</span></div>';
      cardBox.appendChild(card);
    });
    groups.forEach(function (g, gi) {
      var groupMarkers = [];
      g.students.forEach(function (s) {
        var color = s.visited ? '#EA6668' : '#FFA500';
        var marker = new AMap.Marker({
          position: [s.lng, s.lat],
          content: '<div style="width:20px;height:20px;border-radius:50%;background:' + color +
                   ';border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.4);"></div>',
          offset: new AMap.Pixel(-10, -10),
          title: s.name
        });
        marker.on('click', function () {
          var badge = s.visited ? '<span class="badge done">已家访</span>' : '<span class="badge todo">未家访</span>';
          var html = '<div class="popup-name">' + s.name + ' ' + badge + '</div>' +
                     '<div class="popup-row">班级：<b>' + s.cls + '</b></div>' +
                     '<div class="popup-row">学号：<b>' + s.student_id + '</b></div>' +
                     (s.address ? '<div class="popup-row">地址：<b>' + s.address + '</b></div>' : '') +
                     '<div class="popup-row">片区：<b>' + g.name + '</b></div>';
          var info = new AMap.InfoWindow({ content: html, offset: new AMap.Pixel(0, -16) });
          info.open(map, [s.lng, s.lat]);
        });
        map.add(marker);
        groupMarkers.push(marker);
        allMarkers.push(marker);
      });
      var cards = cardBox.getElementsByClassName('group-card');
      (function (gi, groupMarkers) {
        cards[gi].addEventListener('click', function () {
          if (groupMarkers.length === 1) {
            map.setZoomAndCenter(13, groupMarkers[0].getPosition());
          } else {
            map.setFitView(groupMarkers, false, [80, 80, 80, 80]);
          }
        });
      })(gi, groupMarkers);
    });
    if (allMarkers.length > 0) {
      map.setFitView(allMarkers, false, [60, 60, 60, 60]);
    }
  };
  var timer = setInterval(function () {
    if (window.AMap) { clearInterval(timer); window._AMapLoaded(); }
  }, 100);
</script>
</body>
</html>
